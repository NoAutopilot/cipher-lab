name: restricted-guard

# Backstop for restricted material (tools/restricted_guard.py): fails loudly if anything a holder shared
# on a no-publication condition reaches this public repository. Runs on every push and once a day.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# Each run scans every tracked file, so only the newest push's run matters: cancel older queued runs.
# (5 Oct 2026: ~20 sessions pushing dozens of times an hour queued runs until GitHub gave up on them,
# 'job was not acquired by Runner', and mailed the owner a failure for each one.)
concurrency:
  group: restricted-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan for restricted material
        run: python3 tools/restricted_guard.py
