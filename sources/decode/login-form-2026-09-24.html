<form name="flogin" id="flogin" class="ew-form ew-login-form" action="/decrypt-web/login" method="post" novalidate autocomplete="off">
<input type="hidden" name="csrf_name" value="[masked]">
<input type="hidden" name="csrf_value" value="[masked]">
<input type="text" name="username" id="username" autocomplete="username" value="" placeholder="User Name" class="form-control ew-form-control">
<input type="password" name="password" id="password" autocomplete="current-password" placeholder="Password" class="form-control ew-form-control">
<button class="btn btn-primary ew-btn disabled enable-on-init" name="btn-submit" id="btn-submit" type="submit" formaction="/decrypt-web/login">Login</button>
<button type="button" class="btn btn-default btn-sm start" disabled>Start</button>
<button type="button" class="btn btn-default btn-sm cancel">Cancel</button>
<button type="button" class="btn btn-default btn-sm delete" data-type="{{>deleteType}}" data-url="{{>deleteUrl}}">Delete</button>
<button type="button" class="btn btn-default btn-sm cancel">Cancel</button>
<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
<button type="button" class="btn btn-primary ew-btn" data-value="true" data-bs-dismiss="modal">OK</button>
<button type="button" class="btn btn-default ew-btn" data-value="false" data-bs-dismiss="modal">Cancel</button>
<button type="button" class="btn btn-primary ew-btn">Add</button>
<button type="button" class="btn btn-default ew-btn" data-bs-dismiss="modal">Cancel</button>
<input type="file" class="form-control ew-file-input" title="" id="importfiles" name="importfiles[]" multiple lang="en-US">
<button type="button" class="btn btn-primary ew-import-btn d-none">Save</button>
<button type="button" class="btn btn-default ew-close-btn" data-bs-dismiss="modal">Close</button>
<button type="button" class="btn btn-primary ew-crop-btn">Crop</button>
<button type="button" class="btn btn-default ew-skip-btn" data-bs-dismiss="modal">Skip</button>
